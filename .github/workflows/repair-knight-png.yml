name: Repair knight PNG only
on:
  push:
    branches: [fix/knight-alpha-slash-only]
    paths:
      - tools/repair_knight_alpha.py
      - .github/workflows/repair-knight-png.yml
      - tools/export_revised_buttons.py
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Change only the existing knight PNG and retain its backup
        run: python tools/repair_knight_alpha.py
      - name: Export revised UI buttons as real PNG files
        run: python tools/export_revised_buttons.py
      - name: Commit image files to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/knight_sheet_48x64_v2.png assets/knight_sheet_48x64_v2_original.png assets/ui/revised/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: repair original knight and commit revised button PNGs"
            git push
          fi
