name: Native engine checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check motion geometry and atlas
        run: |
          python -m pip install -r Tools/knight-art-requirements.txt
          python native-engine/tools/check_motion.py
      - name: Configure PNG-only native runtime
        run: cmake -S native-engine -B native-engine/build -G Ninja -DECLIPSE_HEADLESS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile real SDL runtime
        run: cmake --build native-engine/build --parallel 2
      - name: Test controls, movement and actual PNG rendering
        run: ctest --test-dir native-engine/build --output-on-failure
      - name: Report native binary sizes (not APK size)
        run: |
          {
            echo '## Native Release build (Linux headless CI)'
            echo 'These are development binary sizes, not an Android APK or memory measurement.'
            echo '```'
            du -h native-engine/build/eclipse_engine native-engine/build/_deps/sdl3-build/libSDL3.so* native-engine/build/_deps/sdl3_image-build/libSDL3_image.so* native-engine/build/assets/knight_motion.png
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render production motion and combat replay
        run: |
          mkdir -p /tmp/eclipse-motion-review
          SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software native-engine/build/eclipse_engine --motion-review /tmp/eclipse-motion-review
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -y -loglevel error -framerate 12 -i /tmp/eclipse-motion-review/frame-%04d.bmp -c:v libx264 -crf 22 -pix_fmt yuv420p -movflags +faststart native-engine/review/ECLIPSE-motion-review.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-knight-motion-review
          path: |
            native-engine/review/ECLIPSE-motion-review.mp4
            native-engine/review/metrics.json
            Assets/Resources/Eclipse/knight_motion.png
          retention-days: 14
          if-no-files-found: error
