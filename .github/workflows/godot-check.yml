name: Godot 4.7.2 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-check:
    name: Parse, import, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Godot editor
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Confirm editor version
        run: godot --version

      - name: Import project and parse scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee godot-import.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:.*(Failed to load|Could not|Parse|Script)' godot-import.log; then
            echo "::error::Godot import/parser reported errors"
            exit 1
          fi

      - name: Start project for 120 frames
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee godot-run.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:.*(Failed to load|Could not|Parse|Script)' godot-run.log; then
            echo "::error::Godot startup reported errors"
            exit 1
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            godot-import.log
            godot-run.log
          if-no-files-found: ignore
