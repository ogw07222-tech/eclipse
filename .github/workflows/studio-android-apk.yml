name: ECLIPSE Studio Android APK
on:
  push:
    branches: [main]
    paths:
      - 'studio/android-app/**'
      - '.github/workflows/studio-android-apk.yml'
  pull_request:
    paths:
      - 'studio/android-app/**'
      - '.github/workflows/studio-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-studio-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio/android-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-Studio-debug-apk
          path: studio/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-Studio-build-diagnostics
          path: |
            studio/android-app/app/build/reports/
            studio/android-app/.gradle/
          if-no-files-found: ignore
