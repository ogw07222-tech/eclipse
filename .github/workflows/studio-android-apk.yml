name: LEGACY Studio APK (migrated to eclipse-studio)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-studio-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: studio/android-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "sdkmanager is not installed"; exit 1; }
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable signing key (main and manual builds)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ECLIPSE_STUDIO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ECLIPSE_STUDIO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ECLIPSE_STUDIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ECLIPSE_STUDIO_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Stable Studio signing secrets missing; configure all four ECLIPSE_STUDIO_* secrets. See studio/android-app/SIGNING.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eclipse-studio-signing.jks"
          test -s "$RUNNER_TEMP/eclipse-studio-signing.jks"
          echo "ECLIPSE_STUDIO_KEYSTORE=$RUNNER_TEMP/eclipse-studio-signing.jks" >> "$GITHUB_ENV"
          echo "ECLIPSE_STUDIO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ECLIPSE_STUDIO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ECLIPSE_STUDIO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Prepare official SDL3 Android Java/C sources
        run: python3 ../../native-engine/tools/prepare_android.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify original SDL3 runtime and game data
        run: |
          python3 ../../native-engine/tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Clean signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/eclipse-studio-signing.jks"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-Studio-debug-apk
          path: studio/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-Studio-build-diagnostics
          path: |
            studio/android-app/app/build/reports/
            studio/android-app/.gradle/
          if-no-files-found: ignore
