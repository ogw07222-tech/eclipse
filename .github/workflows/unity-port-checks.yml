name: Unity port source checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Unity scene, asset GUIDs and original PNGs
        run: python Tools/validate_unity_project.py
      - name: Compile and exercise production combat model
        run: dotnet run --project Tools/CombatChecks/CombatChecks.csproj --configuration Release
